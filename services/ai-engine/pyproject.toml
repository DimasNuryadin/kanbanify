[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinetix-ai-engine"
version = "0.1.0"
description = "Kinetix AI Engine Service - Task decomposition, smart triage, and board copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "litellm>=1.65.0,<2.0.0",
    "openai>=1.70.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.2",
    "mypy>=1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
