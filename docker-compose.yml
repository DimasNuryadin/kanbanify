services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kinetix_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kinetix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinetix} -d ${POSTGRES_DB:-kinetix_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: kinetix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kinetix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  ai-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-engine.Dockerfile
    container_name: kinetix-ai-engine
    restart: unless-stopped
    environment:
      AI_ENGINE_PORT: 8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-orca_internal_sync_token_2026}
      LLM_API_KEY: ${LLM_API_KEY:-your_llm_api_key_here}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "${AI_ENGINE_PORT:-8001}:8001"
    networks:
      - kinetix-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: kinetix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      API_PORT: 8000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinetix}:${POSTGRES_PASSWORD:-kinetix_secret}@postgres:5432/${POSTGRES_DB:-kinetix_db}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_AI_ENGINE_URL: http://ai-engine:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-orca_internal_sync_token_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_dev_key_change_in_prod}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - kinetix-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    container_name: kinetix-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_PORT: 3000
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - kinetix-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  kinetix-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
