openapi: 3.1.0
info:
  title: Kinetix Core API & Internal AI Engine Contract
  version: 3.0.0
  description: >
    Physical REST, WebSocket & AI Service OpenAPI 3.1 specification for the Kinetix
    High-Performance Real-Time Kanban & AI Workspace (Phase 3 Multi-Board Workspace,
    Board Templates & Trello Butler Automation Engine).
servers:
  - url: http://localhost:8000
    description: Fastify Core API Server (apps/api)
  - url: http://localhost:8001
    description: FastAPI AI Engine Service (services/ai-engine)

paths:
  /health:
    get:
      summary: Mandatory health check for Core API (8000) and AI Engine (8001)
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  # ============================================================================
  # WORKSPACE ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/workspaces:
    get:
      summary: List all workspaces with their nested lightweight board summaries
      operationId: listWorkspaces
      responses:
        "200":
          description: Array of workspaces with board summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceWithBoards"
    post:
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/workspaces/{workspaceId}:
    get:
      summary: Get workspace details by ID with board summaries
      operationId: getWorkspaceById
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace details with board summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceWithBoards"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # BOARD TEMPLATE ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/board-templates:
    get:
      summary: List curated board templates (Engineering Sprint, Marketing Launch, Product Roadmap, Personal Kanban)
      operationId: listBoardTemplates
      responses:
        "200":
          description: Array of curated board templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardTemplate"

  # ============================================================================
  # BOARD ENDPOINTS
  # ============================================================================
  /api/v1/boards:
    get:
      summary: List all boards
      operationId: listBoards
      responses:
        "200":
          description: Array of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
    post:
      summary: Create board (supports template_id pre-seeding columns, labels, sample cards, and default Butler rules)
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Created board with columns, labels, members, and Butler automation rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}:
    get:
      summary: Get full board state (columns, cards, labels, members, activities, automation rules)
      operationId: getBoardById
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    patch:
      summary: Update board title, is_starred, background, or manage board labels/members
      operationId: updateBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
    delete:
      summary: Delete a board and its associated columns, cards, and automation rules
      operationId: deleteBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Board deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # COLUMN ENDPOINTS
  # ============================================================================
  /api/v1/boards/{boardId}/columns:
    post:
      summary: Create column (Trello list) in board
      operationId: createColumn
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColumnRequest"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}:
    patch:
      summary: Rename list title, set list color, wip_limit, or archive list (is_archived)
      operationId: updateColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColumnRequest"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}/move:
    patch:
      summary: Reorder list horizontally using fractional index new_position
      operationId: moveColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveColumnRequest"
      responses:
        "200":
          description: Moved column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}/copy:
    post:
      summary: Duplicate list with all its cards
      operationId: copyColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyColumnRequest"
      responses:
        "201":
          description: Duplicated column and its cloned cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyColumnResponse"

  # ============================================================================
  # CARD ENDPOINTS
  # ============================================================================
  /api/v1/boards/{boardId}/cards:
    post:
      summary: Create card in board (evaluates WHEN_CARD_CREATED Butler automation rules)
      operationId: createCard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}:
    patch:
      summary: Update card details (evaluates WHEN_PRIORITY_CHANGED, WHEN_LABEL_ADDED, WHEN_CHECKLIST_COMPLETED Butler rules)
      operationId: updateCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
    delete:
      summary: Permanently delete an archived card
      operationId: deleteCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Card permanently deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean

  /api/v1/cards/{cardId}/move:
    patch:
      summary: Move card (target_column_id, new_position) and evaluate WHEN_CARD_MOVED_TO_COLUMN Butler automation rules
      operationId: moveCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCardRequest"
      responses:
        "200":
          description: Updated moved card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}/copy:
    post:
      summary: Copy card to same or another list
      operationId: copyCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyCardRequest"
      responses:
        "201":
          description: Cloned card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}/comments:
    post:
      summary: Add a comment to a card and append an Activity record
      operationId: createCardComment
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/cards/{cardId}/comments/{commentId}:
    delete:
      summary: Delete a comment from a card
      operationId: deleteCardComment
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean

  /api/v1/cards/{cardId}/ai-decompose:
    post:
      summary: Decompose & enrich card via services/ai-engine, persist checklists/subtasks/points/priority, broadcast CARD_UPDATED
      operationId: aiDecomposeCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated card with AI-generated subtasks/checklists, story_points, and priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  # ============================================================================
  # TRELLO BUTLER AUTOMATION ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/boards/{boardId}/automations:
    get:
      summary: List all automation rules for a board
      operationId: listBoardAutomations
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of automation rules for the board
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRule"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    post:
      summary: Create a new Butler automation rule on a board
      operationId: createBoardAutomation
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRuleRequest"
      responses:
        "201":
          description: Created automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/automations/{ruleId}:
    patch:
      summary: Toggle is_enabled, rename, or update trigger/actions for an automation rule
      operationId: updateAutomationRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRuleRequest"
      responses:
        "200":
          description: Updated automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "404":
          description: Automation rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    delete:
      summary: Delete an automation rule
      operationId: deleteAutomationRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        "404":
          description: Automation rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/automations/ai-generate:
    post:
      summary: Proxies natural language automation prompt + board context to AI Engine (POST /internal/v1/parse-automation)
      operationId: aiGenerateAutomationRule
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Parsed automation rule draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIParseAutomationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # INTERNAL AI ENGINE ENDPOINTS (Port 8001)
  # ============================================================================
  /internal/v1/decompose-task:
    post:
      summary: Internal AI Engine task decomposition endpoint (Port 8001)
      operationId: internalDecomposeTask
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIDecomposeRequest"
      responses:
        "200":
          description: Structured AI decomposition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIDecomposeResponse"

  /internal/v1/enrich-card:
    post:
      summary: Internal AI Engine rich Trello card enrichment endpoint (Port 8001)
      operationId: internalEnrichCard
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISuggestCardEnrichmentRequest"
      responses:
        "200":
          description: Structured AI card enrichment result (description, checklists, labels, points, priority)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISuggestCardEnrichmentResponse"

  /internal/v1/parse-automation:
    post:
      summary: Internal AI Engine natural language Butler automation parser (Port 8001)
      operationId: internalParseAutomation
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIParseAutomationRequest"
      responses:
        "200":
          description: Structured automation trigger and action parsed from prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIParseAutomationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

components:
  schemas:
    PriorityEnum:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    LabelColorEnum:
      type: string
      enum: [green, yellow, orange, red, purple, blue, sky, lime, pink, black]

    ActivityActionTypeEnum:
      type: string
      enum:
        - CARD_CREATED
        - CARD_MOVED
        - CARD_ARCHIVED
        - COMMENT_ADDED
        - CHECKLIST_COMPLETED
        - MEMBER_ASSIGNED
        - AUTOMATION_TRIGGERED

    BoardTemplateCategoryEnum:
      type: string
      enum: [ENGINEERING, MARKETING, PRODUCT, PERSONAL]

    AutomationTriggerTypeEnum:
      type: string
      enum:
        - WHEN_CARD_MOVED_TO_COLUMN
        - WHEN_CARD_CREATED
        - WHEN_CHECKLIST_COMPLETED
        - WHEN_PRIORITY_CHANGED
        - WHEN_LABEL_ADDED

    AutomationActionTypeEnum:
      type: string
      enum:
        - MARK_DUE_DATE_COMPLETE
        - ASSIGN_MEMBER
        - ADD_LABEL
        - SET_PRIORITY
        - MOVE_CARD_TO_COLUMN
        - ADD_CHECKLIST
        - POST_COMMENT

    Member:
      type: object
      required: [id, name, email, avatar_url, initials, color]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: [string, "null"]
        initials:
          type: string
        color:
          type: string

    Label:
      type: object
      required: [id, board_id, name, color]
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColorEnum"

    Subtask:
      type: object
      required: [id, title, is_completed, position]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        position:
          type: string

    ChecklistItem:
      type: object
      required: [id, title, is_completed, position, due_date, assignee_id]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        position:
          type: string
        due_date:
          type: [string, "null"]
        assignee_id:
          type: [string, "null"]

    Checklist:
      type: object
      required: [id, title, position, items]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    Comment:
      type: object
      required:
        - id
        - card_id
        - author_id
        - author_name
        - author_initials
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
        card_id:
          type: string
        author_id:
          type: string
        author_name:
          type: string
        author_initials:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Activity:
      type: object
      required:
        - id
        - board_id
        - card_id
        - actor_name
        - action_type
        - description
        - created_at
      properties:
        id:
          type: string
        board_id:
          type: string
        card_id:
          type: [string, "null"]
        actor_name:
          type: string
        action_type:
          $ref: "#/components/schemas/ActivityActionTypeEnum"
        description:
          type: string
        created_at:
          type: string
          format: date-time
        is_automated:
          type: boolean
          default: false

    Attachment:
      type: object
      required: [id, name, url, type, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        type:
          type: string
          enum: [link, image, file]
        created_at:
          type: string
          format: date-time

    CardCover:
      type: object
      required: [type, value, size]
      properties:
        type:
          type: string
          enum: [none, color, image]
        value:
          type: [string, "null"]
        size:
          type: string
          enum: [normal, full]

    BoardBackground:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [gradient, solid, image]
        value:
          type: string

    AutomationTrigger:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AutomationTriggerTypeEnum"
        column_id:
          type: [string, "null"]
        column_title_match:
          type: [string, "null"]
        priority:
          anyOf:
            - $ref: "#/components/schemas/PriorityEnum"
            - type: "null"
        label_id:
          type: [string, "null"]

    AutomationAction:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AutomationActionTypeEnum"
        member_id:
          type: [string, "null"]
        label_id:
          type: [string, "null"]
        priority:
          anyOf:
            - $ref: "#/components/schemas/PriorityEnum"
            - type: "null"
        target_column_id:
          type: [string, "null"]
        checklist_title:
          type: [string, "null"]
        checklist_items:
          type: [array, "null"]
          items:
            type: string
        comment_text:
          type: [string, "null"]
        due_complete_value:
          type: [boolean, "null"]

    AutomationRule:
      type: object
      required:
        - id
        - board_id
        - name
        - description
        - is_enabled
        - trigger
        - actions
        - execution_count
        - created_at
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        description:
          type: string
        is_enabled:
          type: boolean
          default: true
        trigger:
          $ref: "#/components/schemas/AutomationTrigger"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
        execution_count:
          type: integer
          default: 0
        last_triggered_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          default: ""
        logo_color:
          type: string
          default: "#6366f1"
        created_at:
