openapi: 3.1.0
info:
  title: Kinetix Core API & Internal AI Engine Contract
  version: 4.0.0
  description: >
    Physical REST, WebSocket & AI Service OpenAPI 3.1 specification for the Kinetix
    High-Performance Real-Time Kanban & AI Workspace (Phase 4 Team Productivity Analytics
    Dashboard, AI Executive Sprint Insights, Native Trello JSON Import & CSV/JSON Export).
servers:
  - url: http://localhost:8000
    description: Fastify Core API Server (apps/api)
  - url: http://localhost:8001
    description: FastAPI AI Engine Service (services/ai-engine)

paths:
  /health:
    get:
      summary: Mandatory health check for Core API (8000) and AI Engine (8001)
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  # ============================================================================
  # AUTHENTICATION & DEMO USERS (Phase 6)
  # ============================================================================
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Validation error or email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/auth/login:
    post:
      summary: Authenticate user or demo user
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/auth/me:
    get:
      summary: Return currently authenticated user and active role
      operationId: getAuthMe
      tags:
        - Auth
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/auth/demo-users:
    get:
      summary: Return pre-seeded demo accounts (ADMIN, EDITOR, VIEWER) for 1-click role switching
      operationId: getDemoUsers
      tags:
        - Auth
      responses:
        "200":
          description: Pre-seeded demo user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"

  # ============================================================================
  # WORKSPACE ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/workspaces:
    get:
      summary: List all workspaces with their nested lightweight board summaries
      operationId: listWorkspaces
      responses:
        "200":
          description: Array of workspaces with board summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceWithBoards"
    post:
      summary: Create a new workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/workspaces/{workspaceId}:
    get:
      summary: Get workspace details by ID with board summaries
      operationId: getWorkspaceById
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace details with board summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceWithBoards"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # BOARD TEMPLATE ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/board-templates:
    get:
      summary: List curated board templates (Engineering Sprint, Marketing Launch, Product Roadmap, Personal Kanban)
      operationId: listBoardTemplates
      responses:
        "200":
          description: Array of curated board templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardTemplate"

  # ============================================================================
  # BOARD ENDPOINTS
  # ============================================================================
  /api/v1/boards:
    get:
      summary: List all boards
      operationId: listBoards
      responses:
        "200":
          description: Array of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
    post:
      summary: Create board (supports template_id pre-seeding columns, labels, sample cards, and default Butler rules)
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Created board with columns, labels, members, and Butler automation rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}:
    get:
      summary: Get full board state (columns, cards, labels, members, activities, automation rules)
      operationId: getBoardById
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    patch:
      summary: Update board title, is_starred, background, or manage board labels/members
      operationId: updateBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
    delete:
      summary: Delete a board and its associated columns, cards, and automation rules
      operationId: deleteBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Board deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # MEMBER ROLE & SHAREABLE INVITE LINK ENDPOINTS (Phase 6)
  # ============================================================================
  /api/v1/boards/{boardId}/members:
    post:
      summary: Invite or add a member to the board with a specified role (ADMIN only)
      operationId: addBoardMember
      tags:
        - Board Members
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/BoardRoleEnum"
                  default: EDITOR
      responses:
        "201":
          description: Member added to board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Forbidden (ADMIN only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/members/{memberId}:
    patch:
      summary: Update a member's role (ADMIN, EDITOR, VIEWER) (ADMIN only)
      operationId: updateBoardMemberRole
      tags:
        - Board Members
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/BoardRoleEnum"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Forbidden (ADMIN only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Member or Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    delete:
      summary: Remove member from board (ADMIN only)
      operationId: removeBoardMember
      tags:
        - Board Members
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required: [id, removed]
                properties:
                  id:
                    type: string
                  removed:
                    type: boolean
        "403":
          description: Forbidden (ADMIN only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Member or Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/invites:
    get:
      summary: List active invite links for the board
      operationId: listBoardInvites
      tags:
        - Board Invites
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of invite links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardInviteLink"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    post:
      summary: Generate a new shareable invite link (ADMIN only)
      operationId: createBoardInvite
      tags:
        - Board Invites
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteLinkRequest"
      responses:
        "201":
          description: Created invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardInviteLink"
        "403":
          description: Forbidden (ADMIN only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/invites/{inviteId}:
    delete:
      summary: Revoke or disable an invite link (ADMIN only)
      operationId: revokeInviteLink
      tags:
        - Board Invites
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite link revoked
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id:
                    type: string
                  revoked:
                    type: boolean
        "403":
          description: Forbidden (ADMIN only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/invites/{token}:
    get:
      summary: Public preview of an invite link
      operationId: previewInviteLink
      tags:
        - Board Invites
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite link preview information
          content:
            application/json:
              schema:
                type: object
                required: [board_title, inviter_name, granted_role, is_valid]
                properties:
                  board_id:
                    type: string
                  board_title:
                    type: string
                  inviter_name:
                    type: string
                  granted_role:
                    $ref: "#/components/schemas/BoardRoleEnum"
                  is_valid:
                    type: boolean
        "404":
          description: Invite not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/invites/{token}/join:
    post:
      summary: Redeem a shareable invite link and join board
      operationId: joinViaInvite
      tags:
        - Board Invites
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinViaInviteRequest"
      responses:
        "200":
          description: Joined board successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinViaInviteResponse"
        "400":
          description: Invite expired or max uses exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/security-audit:
    post:
      summary: Proxies board members & invite links to AI Engine for permission and security audit
      operationId: auditBoardPermissions
      tags:
        - Security Audit
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: AI Permission Audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPermissionAuditResponse"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # COLUMN ENDPOINTS
  # ============================================================================
  /api/v1/boards/{boardId}/columns:
    post:
      summary: Create column (Trello list) in board
      operationId: createColumn
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColumnRequest"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}:
    patch:
      summary: Rename list title, set list color, wip_limit, or archive list (is_archived)
      operationId: updateColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColumnRequest"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}/move:
    patch:
      summary: Reorder list horizontally using fractional index new_position
      operationId: moveColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveColumnRequest"
      responses:
        "200":
          description: Moved column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /api/v1/columns/{columnId}/copy:
    post:
      summary: Duplicate list with all its cards
      operationId: copyColumn
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyColumnRequest"
      responses:
        "201":
          description: Duplicated column and its cloned cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyColumnResponse"

  # ============================================================================
  # CARD ENDPOINTS
  # ============================================================================
  /api/v1/boards/{boardId}/cards:
    post:
      summary: Create card in board (evaluates WHEN_CARD_CREATED Butler automation rules)
      operationId: createCard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}:
    patch:
      summary: Update card details (evaluates WHEN_PRIORITY_CHANGED, WHEN_LABEL_ADDED, WHEN_CHECKLIST_COMPLETED Butler rules)
      operationId: updateCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
    delete:
      summary: Permanently delete an archived card
      operationId: deleteCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Card permanently deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean

  /api/v1/cards/{cardId}/move:
    patch:
      summary: Move card (target_column_id, new_position) and evaluate WHEN_CARD_MOVED_TO_COLUMN Butler automation rules
      operationId: moveCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCardRequest"
      responses:
        "200":
          description: Updated moved card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}/copy:
    post:
      summary: Copy card to same or another list
      operationId: copyCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyCardRequest"
      responses:
        "201":
          description: Cloned card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /api/v1/cards/{cardId}/comments:
    post:
      summary: Add a comment to a card and append an Activity record
      operationId: createCardComment
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /api/v1/cards/{cardId}/comments/{commentId}:
    delete:
      summary: Delete a comment from a card
      operationId: deleteCardComment
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean

  /api/v1/cards/{cardId}/ai-decompose:
    post:
      summary: Decompose & enrich card via services/ai-engine, persist checklists/subtasks/points/priority, broadcast CARD_UPDATED
      operationId: aiDecomposeCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated card with AI-generated subtasks/checklists, story_points, and priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  # ============================================================================
  # TRELLO BUTLER AUTOMATION ENDPOINTS (Phase 3)
  # ============================================================================
  /api/v1/boards/{boardId}/automations:
    get:
      summary: List all automation rules for a board
      operationId: listBoardAutomations
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of automation rules for the board
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRule"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    post:
      summary: Create a new Butler automation rule on a board
      operationId: createBoardAutomation
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRuleRequest"
      responses:
        "201":
          description: Created automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/automations/{ruleId}:
    patch:
      summary: Toggle is_enabled, rename, or update trigger/actions for an automation rule
      operationId: updateAutomationRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRuleRequest"
      responses:
        "200":
          description: Updated automation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "404":
          description: Automation rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    delete:
      summary: Delete an automation rule
      operationId: deleteAutomationRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        "404":
          description: Automation rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/automations/ai-generate:
    post:
      summary: Proxies natural language automation prompt + board context to AI Engine (POST /internal/v1/parse-automation)
      operationId: aiGenerateAutomationRule
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Parsed automation rule draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIParseAutomationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # TEAM ANALYTICS, AI SPRINT INSIGHTS & TRELLO IMPORT/EXPORT ENDPOINTS (Phase 4)
  # ============================================================================
  /api/v1/boards/{boardId}/analytics:
    get:
      summary: Compute and return real-time team productivity & sprint analytics for a board
      operationId: getBoardAnalytics
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Computed board analytics (KPIs, column bottlenecks, member workload, priority/label distribution, burndown series)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardAnalytics"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/analytics/ai-report:
    post:
      summary: Compute board analytics and generate an AI Executive Sprint Health & Bottleneck Report via services/ai-engine
      operationId: generateBoardAIAnalyticsReport
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: AI Executive Sprint Health & Bottleneck Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAnalyticsReport"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/import:
    post:
      summary: Import a board from raw Trello JSON export or Kinetix JSON format
      operationId: importBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrelloImportRequest"
      responses:
        "201":
          description: Imported board and summary counts of imported lists, cards, and checklists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrelloImportResult"
        "400":
          description: Validation error or malformed import payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/boards/{boardId}/export:
    get:
      summary: Export full board data as CSV or complete Kinetix/Trello-compatible JSON
      operationId: exportBoard
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: json
      responses:
        "200":
          description: Exported board payload (BoardExportCsvResponse JSON wrapper/text/csv when format=csv, or Board JSON when format=json)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Board"
                  - $ref: "#/components/schemas/BoardExportCsvResponse"
            text/csv:
              schema:
                type: string
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # PHASE 5 OUTBOUND WEBHOOK MANAGEMENT ENDPOINTS (Port 8000)
  # ============================================================================
  /api/v1/boards/{boardId}/webhooks:
    get:
      summary: List outbound webhook configurations for a board
      operationId: listBoardWebhooks
      tags:
        - Webhooks
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of outbound webhook configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookConfig"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    post:
      summary: Create an outbound webhook (Slack/Discord/Custom)
      operationId: createBoardWebhook
      tags:
        - Webhooks
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Outbound webhook configured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          description: Board not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/webhooks/{webhookId}:
    patch:
      summary: Update webhook URL, platform, or is_enabled
      operationId: updateWebhook
      tags:
        - Webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Updated webhook configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookConfig"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
    delete:
      summary: Delete outbound webhook configuration
      operationId: deleteWebhook
      tags:
        - Webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Webhook deleted successfully
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /api/v1/webhooks/{webhookId}/test:
    post:
      summary: Send a test notification ping to Slack/Discord/Custom endpoint
      operationId: testWebhook
      tags:
        - Webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test ping dispatched result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResponse"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  # ============================================================================
  # INTERNAL AI ENGINE ENDPOINTS (Port 8001)
  # ============================================================================
  /internal/v1/decompose-task:
    post:
      summary: Internal AI Engine task decomposition endpoint (Port 8001)
      operationId: internalDecomposeTask
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIDecomposeRequest"
      responses:
        "200":
          description: Structured AI decomposition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIDecomposeResponse"

  /internal/v1/enrich-card:
    post:
      summary: Internal AI Engine rich Trello card enrichment endpoint (Port 8001)
      operationId: internalEnrichCard
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISuggestCardEnrichmentRequest"
      responses:
        "200":
          description: Structured AI card enrichment result (description, checklists, labels, points, priority)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISuggestCardEnrichmentResponse"

  /internal/v1/parse-automation:
    post:
      summary: Internal AI Engine natural language Butler automation parser (Port 8001)
      operationId: internalParseAutomation
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIParseAutomationRequest"
      responses:
        "200":
          description: Structured automation trigger and action parsed from prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIParseAutomationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /internal/v1/analyze-board:
    post:
      summary: Internal AI Engine sprint health & bottleneck analyzer (Port 8001)
      operationId: internalAnalyzeBoard
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIAnalyticsRequest"
      responses:
        "200":
          description: Executive sprint health score, status, bottlenecks, and actionable recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAnalyticsReport"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /internal/v1/format-notification:
    post:
      summary: Internal AI Engine Slack Block Kit & Discord Embed notification formatter (Port 8001)
      operationId: internalFormatNotification
      tags:
        - AI Engine Internal
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISummaryNotificationRequest"
      responses:
        "200":
          description: Formatted Slack Block Kit and Discord Embed notification payloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISummaryNotificationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /internal/v1/audit-permissions:
    post:
      summary: Internal AI Engine workspace access & permission auditor endpoint (Port 8001)
      operationId: internalAuditPermissions
      tags:
        - AI Engine Internal
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIPermissionAuditRequest"
      responses:
        "200":
          description: Permission audit report with risk level, score, findings, and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPermissionAuditResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

components:
  schemas:
    PriorityEnum:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    LabelColorEnum:
      type: string
      enum: [green, yellow, orange, red, purple, blue, sky, lime, pink, black]

    ActivityActionTypeEnum:
      type: string
      enum:
        - CARD_CREATED
        - CARD_MOVED
        - CARD_ARCHIVED
        - COMMENT_ADDED
        - CHECKLIST_COMPLETED
        - MEMBER_ASSIGNED
        - AUTOMATION_TRIGGERED

    BoardTemplateCategoryEnum:
      type: string
      enum: [ENGINEERING, MARKETING, PRODUCT, PERSONAL]

    AutomationTriggerTypeEnum:
      type: string
      enum:
        - WHEN_CARD_MOVED_TO_COLUMN
        - WHEN_CARD_CREATED
        - WHEN_CHECKLIST_COMPLETED
        - WHEN_PRIORITY_CHANGED
        - WHEN_LABEL_ADDED

    AutomationActionTypeEnum:
      type: string
      enum:
        - MARK_DUE_DATE_COMPLETE
        - ASSIGN_MEMBER
        - ADD_LABEL
        - SET_PRIORITY
        - MOVE_CARD_TO_COLUMN
        - ADD_CHECKLIST
        - POST_COMMENT

    Member:
      type: object
      required: [id, name, email, avatar_url, initials, color]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: [string, "null"]
        initials:
          type: string
        color:
          type: string
        role:
          $ref: "#/components/schemas/BoardRoleEnum"
          default: EDITOR
        joined_at:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, avatar_url, initials, color, default_role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: [string, "null"]
        initials:
          type: string
        color:
          type: string
        default_role:
          $ref: "#/components/schemas/BoardRoleEnum"
          default: EDITOR

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    AuthSessionResponse:
      type: object
      required: [token, user, expires_at]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        expires_at:
          type: string
          format: date-time

    BoardInviteLink:
      type: object
      required:
        - id
        - board_id
        - token
        - role
        - created_by_id
        - created_by_name
        - uses_count
        - is_active
        - created_at
      properties:
        id:
          type: string
        board_id:
          type: string
        token:
          type: string
        role:
          $ref: "#/components/schemas/BoardRoleEnum"
        created_by_id:
          type: string
        created_by_name:
          type: string
        max_uses:
          type: [integer, "null"]
        uses_count:
          type: integer
          default: 0
        expires_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time

    CreateInviteLinkRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/BoardRoleEnum"
          default: EDITOR
        max_uses:
          type: [integer, "null"]
        expires_in_hours:
          type: [number, "null"]

    JoinViaInviteRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email

    JoinViaInviteResponse:
      type: object
      required: [board_id, board_title, granted_role, member]
      properties:
        board_id:
          type: string
        board_title:
          type: string
        granted_role:
          $ref: "#/components/schemas/BoardRoleEnum"
        member:
          $ref: "#/components/schemas/Member"

    Label:
      type: object
      required: [id, board_id, name, color]
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColorEnum"

    Subtask:
      type: object
      required: [id, title, is_completed, position]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        position:
          type: string

    ChecklistItem:
      type: object
      required: [id, title, is_completed, position, due_date, assignee_id]
      properties:
        id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        position:
          type: string
        due_date:
          type: [string, "null"]
        assignee_id:
          type: [string, "null"]

    Checklist:
      type: object
      required: [id, title, position, items]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    Comment:
      type: object
      required:
        - id
        - card_id
        - author_id
        - author_name
        - author_initials
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
        card_id:
          type: string
        author_id:
          type: string
        author_name:
          type: string
        author_initials:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Activity:
      type: object
      required:
        - id
        - board_id
        - card_id
        - actor_name
        - action_type
        - description
        - created_at
      properties:
        id:
          type: string
        board_id:
          type: string
        card_id:
          type: [string, "null"]
        actor_name:
          type: string
        action_type:
          $ref: "#/components/schemas/ActivityActionTypeEnum"
        description:
          type: string
        created_at:
          type: string
          format: date-time
        is_automated:
          type: boolean
          default: false

    Attachment:
      type: object
      required: [id, name, url, type, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        type:
          type: string
          enum: [link, image, file]
        created_at:
          type: string
          format: date-time

    CardCover:
      type: object
      required: [type, value, size]
      properties:
        type:
          type: string
          enum: [none, color, image]
        value:
          type: [string, "null"]
        size:
          type: string
          enum: [normal, full]

    BoardBackground:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [gradient, solid, image]
        value:
          type: string

    AutomationTrigger:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AutomationTriggerTypeEnum"
        column_id:
          type: [string, "null"]
        column_title_match:
          type: [string, "null"]
        priority:
          anyOf:
            - $ref: "#/components/schemas/PriorityEnum"
            - type: "null"
        label_id:
          type: [string, "null"]

    AutomationAction:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AutomationActionTypeEnum"
        member_id:
          type: [string, "null"]
        label_id:
          type: [string, "null"]
        priority:
          anyOf:
            - $ref: "#/components/schemas/PriorityEnum"
            - type: "null"
        target_column_id:
          type: [string, "null"]
        checklist_title:
          type: [string, "null"]
        checklist_items:
          type: [array, "null"]
          items:
            type: string
        comment_text:
          type: [string, "null"]
        due_complete_value:
          type: [boolean, "null"]

    AutomationRule:
      type: object
      required:
        - id
        - board_id
        - name
        - description
        - is_enabled
        - trigger
        - actions
        - execution_count
        - created_at
      properties:
        id:
          type: string
        board_id:
          type: string
        name:
          type: string
        description:
          type: string
        is_enabled:
          type: boolean
          default: true
        trigger:
          $ref: "#/components/schemas/AutomationTrigger"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
        execution_count:
          type: integer
          default: 0
        last_triggered_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          default: ""
        logo_color:
          type: string
          default: "#6366f1"
        created_at:
          type: string
          format: date-time

    BoardSummary:
      type: object
      required: [id, workspace_id, title, is_starred, background]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        title:
          type: string
        is_starred:
          type: boolean
          default: false
        background:
          $ref: "#/components/schemas/BoardBackground"
        card_count:
          type: integer
          default: 0
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        description:
          type: string

    WorkspaceWithBoards:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          properties:
            boards:
              type: array
              items:
                $ref: "#/components/schemas/BoardSummary"

    BoardTemplate:
      type: object
      required: [id, name, description, category, background, default_columns, sample_cards_count]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/BoardTemplateCategoryEnum"
        background:
          $ref: "#/components/schemas/BoardBackground"
        default_columns:
          type: array
          items:
            type: string
        sample_cards_count:
          type: integer
          default: 0

    Card:
      type: object
      required:
        - id
        - board_id
        - column_id
        - title
        - description
        - position
        - priority
        - story_points
        - tags
        - subtasks
        - blocked_by_card_ids
        - due_date
        - updated_at
        - cover
        - label_ids
        - member_ids
        - checklists
        - comments
        - attachments
        - start_date
        - is_due_complete
        - is_archived
        - is_watching
      properties:
        id:
          type: string
          format: uuid
        board_id:
          type: string
          format: uuid
        column_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        position:
          type: string
        priority:
          $ref: "#/components/schemas/PriorityEnum"
        story_points:
          type: [integer, "null"]
        tags:
          type: array
          items:
            type: string
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/Subtask"
        blocked_by_card_ids:
          type: array
          items:
            type: string
            format: uuid
        due_date:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time
        cover:
          $ref: "#/components/schemas/CardCover"
        label_ids:
          type: array
          items:
            type: string
        member_ids:
          type: array
          items:
            type: string
        checklists:
          type: array
          items:
            $ref: "#/components/schemas/Checklist"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
